<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PushPop 推推爆</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 主菜单 -->
        <div id="main-menu" class="screen active">
            <div class="logo">
                <h1>PushPop</h1>
                <p class="subtitle">推推爆</p>
            </div>
            <div class="game-guide">
                <div class="guide-title">🎮 玩法说明</div>
                <div class="guide-steps">
                    <div class="guide-step">
                        <span class="step-num">1</span>
                        <span class="step-text">点击牌堆抽卡</span>
                    </div>
                    <div class="guide-step">
                        <span class="step-num">2</span>
                        <span class="step-text">拖动手牌出牌</span>
                    </div>
                    <div class="guide-step">
                        <span class="step-num">3</span>
                        <span class="step-text">3个同色消除</span>
                    </div>
                </div>
            </div>
            <div class="level-selection">
                <div class="level-grid" id="level-grid"></div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <button class="back-btn">←</button>
                <div class="mode-indicator">
                    <span id="current-mode-icon">🎮</span>
                    <span id="current-mode-name">PushPop</span>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">得分</span>
                        <span id="score" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <div class="game-board-container">
                <div id="game-board"></div>
            </div>

            <!-- 待出牌区 -->
            <div class="play-area">
                <div class="play-area-zone" id="play-zone">
                    <div class="play-area-grid" id="play-area-grid"></div>
                </div>
            </div>

            <div class="hand-area">
                <div class="hand-label">手牌</div>
                <div class="hand-slots">
                    <div class="hand-slot" data-slot="0"></div>
                    <div class="hand-slot" data-slot="1"></div>
                </div>
            </div>
        </div>

        <!-- 结算界面 -->
        <div id="result-screen" class="screen overlay">
            <div class="overlay-content">
                <div id="result-icon" class="result-icon">🏆</div>
                <h2 id="result-title">胜利!</h2>
                <div class="result-stats">
                    <div class="result-stat">
                        <span class="result-label">最终得分</span>
                        <span id="final-score" class="result-value">0</span>
                    </div>
                    <div class="result-stat">
                        <span id="result-stat-label" class="result-label">PushPop</span>
                        <span id="result-stat-value" class="result-value">🎉</span>
                    </div>
                </div>
                <div id="star-rating" class="star-rating">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </div>
                <button id="play-again-btn" class="primary-btn">再玩一次</button>
                <button id="back-menu-btn" class="secondary-btn">返回主菜单</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
